# Black & white rice

font_family      Cascadia Mono NF
font_size        11.0

# Colors — swappable via ~/.config/rice/toggle-theme.sh
include theme.conf

# Let the toggle script recolor already-open kitty windows live
allow_remote_control yes
listen_on unix:@mykitty

background_opacity     1.0
dynamic_background_opacity no

# Subtle motion: quick cursor trail + smooth resize/scroll
cursor_trail            3
cursor_trail_decay      0.1 0.4
cursor_blink_interval   0.5
resize_debounce_time    0.08
window_resize_gravity   center

# No title bar, matches the rest of the rice
hide_window_decorations yes
window_padding_width    10
enable_audio_bell       no
confirm_os_window_close 0

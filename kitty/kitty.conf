# Black & white rice

font_family      Cascadia Mono NF
font_size        11.0

# Colors — swappable via ~/.config/rice/toggle-theme.sh
include theme.conf

# Let the toggle script recolor already-open kitty windows live
allow_remote_control yes
listen_on unix:@mykitty

background_opacity     1.0
dynamic_background_opacity no

# Subtle motion: thin beam cursor with a quick trail (trail color comes
# from each theme-*.conf), eased blink, smooth resize/scroll
cursor_shape            beam
cursor_beam_thickness   1.8
cursor_trail            3
cursor_trail_decay      0.1 0.4
cursor_blink_interval   0.5 ease-in-out
resize_debounce_time    0.08

# No title bar, matches the rest of the rice
hide_window_decorations yes
window_padding_width    10
enable_audio_bell       no
confirm_os_window_close 0

# Rounded powerline tabs (colors come from each theme-*.conf)
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     round
tab_bar_min_tabs        2
# superscript index, a zoom marker while a split is maximized, bell/activity
tab_title_template      "{sup.index} {'󰊓 ' if layout_name == 'stack' else ''}{title[:30]}"
tab_bar_margin_width    6
tab_bar_margin_height   4 0
bell_on_tab             "󰂞 "
tab_activity_symbol     "● "
active_tab_font_style   bold
inactive_tab_font_style normal

# Breathing room between lines
modify_font cell_height 108%

# Links get a curly underline
url_style               curly

# Split panes (kitty's own ctrl+shift+enter etc.): thin borders, and
# inactive panes fade back so the focused one stands out
draw_minimal_borders    yes
window_border_width     1pt
inactive_text_alpha     0.65

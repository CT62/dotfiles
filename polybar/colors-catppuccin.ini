; Catppuccin Mocha — mauve accent, each module's icon tinted its own pastel.
[colors]
background = #1e1e2e
background-alt = #313244
foreground = #cdd6f4
foreground-alt = #7f849c
border = #45475a
accent = #cba6f7
accent-fg = #11111b
c1 = #89b4fa
c2 = #a6e3a1
c3 = #fab387
c4 = #f5c2e7

; Bar geometry — flat, full-width, edge-to-edge.
[geom]
width = 100%
offset-x = 0
offset-y = 0
radius = 0
border-size = 1
line-size = 2

; Black & white — monochrome; the icon tints (c1..c4) are just greys.
[colors]
background = #000000
background-alt = #161616
foreground = #FFFFFF
foreground-alt = #6E6E6E
border = #2E2E2E
accent = #FFFFFF
accent-fg = #000000
c1 = #FFFFFF
c2 = #CFCFCF
c3 = #A8A8A8
c4 = #FFFFFF

; Bar geometry — flat, full-width, edge-to-edge.
[geom]
width = 100%
offset-x = 0
offset-y = 0
radius = 0
border-size = 1
line-size = 2

; Colors — swappable via ~/.config/rice/toggle-theme.sh
include-file = ~/.config/polybar/colors.ini

[bar/main]
width = 100%
height = 30
offset-x = 0
offset-y = 0
bottom = false
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

border-size = 1
border-color = ${colors.border}

padding-left = 2
padding-right = 2
module-margin = 1

font-0 = "Cascadia Mono NF:size=10;3"

modules-left = i3 sep temperature
modules-center = date
modules-right = failedunits micmute cpu memory sep powermenu systray

cursor-click = pointer
enable-ipc = true

[bar/bottom]
width = 100%
height = 30
offset-x = 0
offset-y = 0
bottom = true
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

border-size = 1
border-color = ${colors.border}

padding-left = 2
padding-right = 2
module-margin = 1

font-0 = "Cascadia Mono NF:size=10;3"

modules-left = storage sep uptime
modules-center = nowplaying
modules-right = pulseaudio sep battery

cursor-click = pointer
enable-ipc = true

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
; scroll over the workspaces to switch
enable-scroll = true

label-focused = "● %index%"
label-focused-foreground = ${colors.foreground}
label-focused-underline = ${colors.foreground}
label-focused-padding = 2

label-unfocused = "○ %index%"
label-unfocused-foreground = ${colors.foreground-alt}
label-unfocused-padding = 2

label-visible = "◐ %index%"
label-visible-foreground = ${colors.foreground}
label-visible-padding = 2

label-urgent = "▲ %index%"
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.foreground}
label-urgent-padding = 2

[module/nowplaying]
type = custom/script
exec = ~/.config/polybar/now-playing.sh
interval = 1
label = %output%
label-foreground = ${colors.foreground-alt}
click-left = playerctl play-pause
click-right = playerctl next

[module/sep]
type = custom/text
format = "  "
format-foreground = ${colors.foreground-alt}

[module/cpu]
type = custom/script
exec = ~/.config/polybar/cpu.sh
interval = 2
label = "CPU %output%"
label-foreground = ${colors.foreground}

[module/memory]
type = custom/script
exec = ~/.config/polybar/mem.sh
interval = 2
label = "MEM %output%"
label-foreground = ${colors.foreground}

[module/temperature]
type = internal/temperature
thermal-zone = 7
base-temperature = 40
warn-temperature = 80
units = true
interval = 2
format = <ramp> <label>
format-warn = <ramp> <label-warn>
label = "TEMP %temperature-c%"
label-warn = "TEMP %temperature-c%"
label-warn-foreground = #E64553
label-warn-background = ${colors.background}

; icon colored green -> red as temperature climbs from base to warn
ramp-0 = %{F#4CD97B}◈%{F-}
ramp-1 = %{F#8BD46E}◈%{F-}
ramp-2 = %{F#C4D96C}◈%{F-}
ramp-3 = %{F#F2C94C}◈%{F-}
ramp-4 = %{F#F5A25C}◈%{F-}
ramp-5 = %{F#F2735C}◈%{F-}
ramp-6 = %{F#E64553}◈%{F-}

[module/uptime]
type = custom/script
exec = ~/.config/polybar/uptime.sh
interval = 60
label = %output%
label-foreground = ${colors.foreground-alt}

[module/failedunits]
type = custom/script
exec = ~/.config/polybar/failed-units.sh
interval = 30
label = %output%
label-foreground = ${colors.background}
label-background = ${colors.foreground}
click-left = kitty -e systemctl --failed

[module/micmute]
type = custom/script
exec = ~/.config/polybar/mic-mute.sh
interval = 2
label = %output%
label-foreground = ${colors.background}
label-background = ${colors.foreground}
click-left = pactl set-source-mute @DEFAULT_SOURCE@ toggle

[module/storage]
type = custom/script
exec = ~/.config/polybar/storage.sh
interval = 30
label = %output%
label-foreground = ${colors.foreground}

[module/systray]
type = internal/tray
format-margin = 8px
tray-spacing = 8px
tray-background = ${colors.background}

[module/powermenu]
type = custom/text
format = "⏻"
format-foreground = ${colors.foreground}
click-left = ~/.config/polybar/powermenu.sh

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted = "♪ muted"
label-muted-foreground = ${colors.foreground-alt}
ramp-volume-0 = ♪
ramp-volume-1 = ♪
ramp-volume-2 = ♪

[module/wlan]
type = internal/network
interface = wlo1
interval = 5.0
format-connected = <label-connected>
label-connected = "≈ %essid%"
format-disconnected = <label-disconnected>
label-disconnected = "≈ offline"
label-disconnected-foreground = ${colors.foreground-alt}

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/bluetooth.sh
interval = 5
click-left = ~/.config/polybar/bluetooth.sh toggle
label-foreground = ${colors.foreground}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 98
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
label-charging = %percentage%% ⚡
label-discharging = %percentage%%
label-full = %percentage%%

; animated bolt overlay on the capacity glyph while charging
; colored red -> orange -> yellow -> green as capacity rises
animation-charging-0 = %{F#E64553}▁%{F-}
animation-charging-1 = %{F#F2735C}▂%{F-}
animation-charging-2 = %{F#F5A25C}▃%{F-}
animation-charging-3 = %{F#F2C94C}▅%{F-}
animation-charging-4 = %{F#C4D96C}▆%{F-}
animation-charging-5 = %{F#8BD46E}▇%{F-}
animation-charging-6 = %{F#4CD97B}█%{F-}
animation-charging-framerate = 300

; proportional battery gauge using eighth-block glyphs
; colored red -> orange -> yellow -> green as capacity rises
ramp-capacity-0 = %{F#E64553}▁%{F-}
ramp-capacity-1 = %{F#F2735C}▂%{F-}
ramp-capacity-2 = %{F#F5A25C}▃%{F-}
ramp-capacity-3 = %{F#F2C94C}▅%{F-}
ramp-capacity-4 = %{F#C4D96C}▆%{F-}
ramp-capacity-5 = %{F#8BD46E}▇%{F-}
ramp-capacity-6 = %{F#4CD97B}█%{F-}

[module/date]
type = internal/date
interval = 1
date = "◷ %H:%M"
date-alt = "◷ %Y-%m-%d %H:%M:%S"
label = %date%

[settings]
screenchange-reload = true

[global/wm]
margin-top = 0
margin-bottom = 0

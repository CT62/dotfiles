; Colors + bar geometry ([colors] and [geom]) — swappable via
; ~/.config/rice/toggle-theme.sh
include-file = ~/.config/polybar/colors.ini

; Shared look for every bar: flat and full-width (see [geom]), with
; module icons tinted via format-prefix (polybar can't splice ${colors.*}
; into the middle of a label, so each icon is its own prefix).
[bar/base]
width = ${geom.width}
height = 32
offset-x = ${geom.offset-x}
offset-y = ${geom.offset-y}
radius = ${geom.radius}
line-size = ${geom.line-size}
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

border-size = ${geom.border-size}
border-color = ${colors.border}

padding-left = 2
padding-right = 2
module-margin = 1

font-0 = "Cascadia Mono NF:size=10;3"

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[bar/main]
inherit = bar/base
monitor = ${env:MONITOR:}
bottom = false

; One bar for everything: workspaces, temp, volume and battery on the left,
; the clock dead-centre, system stats / connectivity on the right.
modules-left = i3 sep temperature pulseaudio battery
modules-center = date
modules-right = failedunits micmute cpu memory sep network bluetooth theme systray

[module/i3]
type = internal/i3
pin-workspaces = false
strip-wsnumbers = true
index-sort = true
enable-click = true
; scroll over the workspaces to switch
enable-scroll = true

; focused = filled dot in the accent color; the rest stay dim
label-focused = "󰝥 %index%"
label-focused-foreground = ${colors.accent}
label-focused-padding = 2

label-unfocused = "󰝦 %index%"
label-unfocused-foreground = ${colors.foreground-alt}
label-unfocused-padding = 2

label-visible = "󰪟 %index%"
label-visible-foreground = ${colors.foreground}
label-visible-padding = 2

label-urgent = "󰀦 %index%"
label-urgent-foreground = ${colors.c3}
label-urgent-padding = 2

; resize mode etc. shows up as a highlighted tag
label-mode = "󰪣 %mode%"
label-mode-foreground = ${colors.accent-fg}
label-mode-background = ${colors.c3}
label-mode-padding = 2

[module/nowplaying]
type = custom/script
exec = ~/.config/polybar/now-playing.sh
interval = 1
label = %output%
label-foreground = ${colors.foreground-alt}
; the media buttons in the output carry their own click actions; these
; cover clicks on the rest of the text
click-left = playerctl play-pause
click-right = playerctl next
scroll-up = playerctl volume 0.05+
scroll-down = playerctl volume 0.05-

[module/sep]
type = custom/text
format = "│"
format-foreground = ${colors.border}

[module/cpu]
type = custom/script
exec = ~/.config/polybar/cpu.sh
interval = 2
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.c1}
label = %output%
click-left = kitty -e htop

[module/memory]
type = custom/script
exec = ~/.config/polybar/mem.sh
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.c2}
label = %output%
click-left = kitty -e htop --sort-key PERCENT_MEM

[module/temperature]
; k10temp (Tctl) via temp.sh -- this host has no /sys/class/thermal
; thermal_zone entries, so the internal/temperature module can't be used.
type = custom/script
exec = ~/.config/polybar/temp.sh
interval = 2

[module/failedunits]
type = custom/script
exec = ~/.config/polybar/failed-units.sh
interval = 30
label = %output%
label-foreground = ${colors.accent-fg}
label-background = ${colors.c3}
label-padding = 1
click-left = kitty -e systemctl --failed

[module/micmute]
type = custom/script
exec = ~/.config/polybar/mic-mute.sh
interval = 2
label = %output%
label-foreground = ${colors.accent-fg}
label-background = ${colors.c3}
label-padding = 1
click-left = pactl set-source-mute @DEFAULT_SOURCE@ toggle

[module/systray]
type = internal/tray
format-margin = 4px
tray-spacing = 8px
tray-background = ${colors.background}

[module/theme]
type = custom/text
; nf-md-palette — left: theme picker, right: shuffle wallpaper
format = "󰏘"
format-foreground = ${colors.c4}
click-left = ~/.config/rice/theme-picker.sh
click-right = ~/.config/rice/set-wallpaper.sh

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted = "󰝟 muted"
label-muted-foreground = ${colors.foreground-alt}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.c2}
click-right = pavucontrol

[module/network]
type = custom/script
exec = ~/.config/polybar/network.sh
interval = 5
click-left = rofi -show network-info -modi network-info:~/.config/rofi/network-info.sh -theme ~/.config/rofi/current.rasi
label-foreground = ${colors.c1}

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/bluetooth.sh
interval = 5
click-left = rofi -show bluetooth -modi bluetooth:~/.config/rofi/bluetooth.sh -theme ~/.config/rofi/current.rasi
click-right = ~/.config/polybar/bluetooth.sh toggle
label-foreground = ${colors.c1}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 98
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
label-charging = %percentage%% 󱐋
label-discharging = %percentage%%
label-full = %percentage%%

; nf-md battery glyphs filling up while charging
; colored red -> orange -> yellow -> green as capacity rises
animation-charging-0 = %{F#E64553}󰢜%{F-}
animation-charging-1 = %{F#F2735C}󰂇%{F-}
animation-charging-2 = %{F#F5A25C}󰢝%{F-}
animation-charging-3 = %{F#F2C94C}󰂉%{F-}
animation-charging-4 = %{F#C4D96C}󰢞%{F-}
animation-charging-5 = %{F#8BD46E}󰂋%{F-}
animation-charging-6 = %{F#4CD97B}󰂅%{F-}
animation-charging-framerate = 500

; battery gauge glyph, colored red -> orange -> yellow -> green as
; capacity rises
ramp-capacity-0 = %{F#E64553}󰂎%{F-}
ramp-capacity-1 = %{F#F2735C}󰁻%{F-}
ramp-capacity-2 = %{F#F5A25C}󰁽%{F-}
ramp-capacity-3 = %{F#F2C94C}󰁿%{F-}
ramp-capacity-4 = %{F#C4D96C}󰂀%{F-}
ramp-capacity-5 = %{F#8BD46E}󰂂%{F-}
ramp-capacity-6 = %{F#4CD97B}󰁹%{F-}

[module/date]
type = internal/date
interval = 1
date = "%a %d %b"
time = "%H:%M"
date-alt = "%Y-%m-%d"
time-alt = "%H:%M:%S"
format-prefix = "󰃭 "
format-prefix-foreground = ${colors.accent}
label = "%date%  %time%"
label-foreground = ${colors.foreground}

[settings]
screenchange-reload = true

[global/wm]
margin-top = 0
margin-bottom = 0

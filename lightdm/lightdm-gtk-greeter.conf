[greeter]
# LightDM GTK greeter config for this rice.
#
# The backgrounds are rendered by lightdm/install-greeter.sh using
# rice/lock-art.sh, the same artwork the lock screen (rice/lock.sh) draws,
# so the login screen and the lock screen match: plain black, the hostname
# above centre and the login box (Rice-Greeter/gtk-3.0/gtk.css) centred.
background=/usr/share/backgrounds/lockscreen-greeter-bw.png
user-background=false
transition-type=none
theme-name=Rice-Greeter
icon-theme-name=Adwaita
cursor-theme-name=Adwaita
font-name=Cascadia Mono NF 10
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
position=50% 50%
hide-user-image=true
default-user-image=#avatar-default-symbolic
indicators=~host;~spacer;~session;~a11y;~clock;~power
clock-format=%H:%M  ·  %a %d %b
active-monitor=#cursor

# LightDM GTK greeter config for this rice.
#
# background is generated at install time by install.sh, which runs the
# wallpaper picked from wallpapers/wallpaper-bw through the same
# grayscale/blur/dim treatment rice/lock.sh applies to the live lock
# screen, so the login screen and the lock screen match.
[greeter]
background=/usr/share/backgrounds/lockscreen-greeter-bw.png
theme-name=Adwaita-dark
icon-theme-name=Adwaita
cursor-theme-name=Adwaita
font-name=Cascadia Mono NF 10

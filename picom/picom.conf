# Compositor config, shared by every theme — subtle motion only, no
# color/blur noise.

backend = "xrender";
vsync = true;

# Fade animations on open/close only (no focus-based dimming)
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;
fade-exclude = [];
no-fading-openclose = false;

# Soft rounded corners to match the minimal look
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "window_type = 'desktop'"
];
round-borders = 2;

# Gentle shadow, kept grayscale
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.55;
shadow-color = "#000000";
shadow-exclude = [
  "window_type = 'desktop'"
];

# No opacity difference between focused/unfocused — fully solid always
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
focus-exclude = [ "class_g = 'Polybar'" ];

wintypes: {
  dock = { shadow = false; fade = false; };
  desktop = { shadow = false; fade = false; };
  popup_menu = { opacity = 0.96; };
  dropdown_menu = { opacity = 0.96; };
};

# Pop-in/pop-out animation for every window — most noticeable on rofi
# (the run menu and power menu), since those appear/disappear instantly.
animations = (
  {
    triggers = [ "open", "show" ];
    preset = "appear";
    scale = 0.85;
    duration = 0.18;
  },
  {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    scale = 0.85;
    duration = 0.15;
  },
  # Tiling moves/resizes glide instead of jumping (comment this block out
  # if it ever leaves artifacts).
  {
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.18;
  }
);
